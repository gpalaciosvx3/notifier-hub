name: DEV · Deploy (AWS)

on:
  push:
    branches: [develop]

jobs:
  deploy:
    name: Despliegue en AWS DEV
    runs-on: ubuntu-latest
    environment: deployer-dev

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restaurar caché de dependencias
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            cdk/node_modules
          key: deps-${{ hashFiles('package.json', 'cdk/package.json') }}

      - name: Instalar dependencias
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install && cd cdk && npm install

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Bootstrap del entorno CDK
        working-directory: cdk
        env:
          CDK_STAGE: dev
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          SES_SOURCE_EMAIL: ${{ secrets.SES_SOURCE_EMAIL }}
        run: npx cdk bootstrap aws://${{ secrets.CDK_DEFAULT_ACCOUNT }}/${{ secrets.AWS_DEFAULT_REGION }}

      - name: Desplegar stack en AWS DEV
        working-directory: cdk
        env:
          CDK_STAGE: dev
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          SES_SOURCE_EMAIL: ${{ secrets.SES_SOURCE_EMAIL }}
        run: npx cdk deploy --require-approval never --all
