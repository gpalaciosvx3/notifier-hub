name: PRD · Build

on:
  pull_request:
    branches: [master]

jobs:
  build:
    name: Validación y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restaurar caché de dependencias
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            cdk/node_modules
          key: deps-${{ hashFiles('package.json', 'cdk/package.json') }}

      - name: Instalar dependencias
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install && cd cdk && npm install

      - name: Validar plantilla CDK
        working-directory: cdk
        env:
          CDK_STAGE: prd
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          SES_SOURCE_EMAIL: ${{ secrets.SES_SOURCE_EMAIL }}
        run: npx cdk synth --quiet
